<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muzi Li · Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#0d1224" />
  <meta name="description" content="Muzi's personal website, terminal edition." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Instrument+Serif:ital@1&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="window">
  <header class="titlebar">
    <div class="dots" aria-hidden="true">
      <span class="dot red">
        <svg viewBox="0 0 16 16"><path d="M5 5l6 6M11 5l-6 6" /></svg>
      </span>
      <span class="dot yellow">
        <svg viewBox="0 0 16 16"><path d="M4.5 8h7" /></svg>
      </span>
      <span class="dot green">
        <svg viewBox="0 0 16 16"><path class="fill" d="M4.5 11.5V6.5L9.5 11.5Z M11.5 4.5V9.5L6.5 4.5Z" /></svg>
      </span>
    </div>
    <div class="title">muzi@portfolio: <span id="title-path">~</span></div>
  </header>
  <main id="terminal" class="terminal">
    <h1 class="banner">
      <span class="banner-user" id="banner-user"></span><span class="banner-text" id="banner-text"></span><span class="banner-star" aria-hidden="true">☆</span>
    </h1>
    <h2 class="subtitle" id="subtitle"></h2>
    <p class="line">Visit <a id="normal-site" href="#" target="_blank" rel="noopener">Normal website</a></p>

    <div id="output"></div>

    <form id="prompt-form" class="prompt-line" autocomplete="off">
      <label for="input" class="prompt"><span class="lambda">λ</span> :: <span class="path" id="prompt-path">~</span> <span class="arrows">&gt;&gt;</span></label>
      <div class="input-wrap">
        <div class="ghost" id="ghost" aria-hidden="true"><span class="ghost-typed" id="ghost-typed"></span><span class="ghost-rest" id="ghost-rest"></span></div>
        <input id="input" type="text" spellcheck="false" autocapitalize="off" autofocus aria-label="Terminal input" />
      </div>
    </form>
  </main>
  </div>
  <footer class="site-footer">made with <span class="heart" aria-label="love">♥</span> by <span class="footer-name">muzi</span></footer>
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">‹</button>
    <figure class="lb-figure">
      <img id="lb-img" alt="" />
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">›</button>
  </div>
  <script src="portrait.js"></script>
  <script src="worldmap.js"></script>
  <script src="script.js"></script>
</body>
</html>
